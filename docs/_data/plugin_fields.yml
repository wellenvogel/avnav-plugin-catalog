name:
  short:
    en: Required; plugin name in AvNav
    de: Pflicht; Plugin-Name in AvNav
  description:
    en: Required. The plugin name as shown in AvNav is also its directory name on the server. For `package` plugins, the files must be under `/usr/lib/avnav/plugins/<name>`. For `zip` plugins, it must be the name of the top-level directory containing all plugin files in the ZIP archive.
    de: Pflicht. Der in AvNav angezeigte Plugin-Name ist zugleich der Verzeichnisname auf dem Server. Bei `package`-Plugins müssen die Dateien unter `/usr/lib/avnav/plugins/<name>` liegen. Bei `zip`-Plugins muss er dem Namen des obersten Verzeichnisses entsprechen, das alle Plugin-Dateien im ZIP-Archiv enthält.
  placeholder: "[name]"
description:
  short:
    en: Required; English and/or German, maximum 80 characters
    de: Pflicht; Englisch und/oder Deutsch, maximal 80 Zeichen
  description:
    en: Required. Provide a short description of the plugin's functionality in at least one of `en` or `de`, with at most 80 characters per description.
    de: Pflicht. Eine kurze Beschreibung der Plugin-Funktionalität in mindestens einer der Sprachen `en` oder `de` angeben, mit höchstens 80 Zeichen je Beschreibung.
  placeholder: "en: [English]; de: [Deutsch]"
version:
  short:
    en: Required; version from plugin.json
    de: Pflicht; Version aus plugin.json
  description:
    en: Required. A number or [SemVer](https://semver.org/) version string matching the version reported in `plugin.json`.
    de: Pflicht. Eine Zahl oder eine [SemVer](https://semver.org/)-Versionszeichenkette, die der Version in `plugin.json` entspricht.
  placeholder: "[version]"
platform:
  short:
    en: "Required; android, linux, windows, raspberry, or all"
    de: "Pflicht; android, linux, windows, raspberry oder all"
  description:
    en: "Required. List supported platforms: `android`, `linux`, `windows`, `raspberry`, or `all`. `all` means every platform."
    de: "Pflicht. Unterstützte Plattformen angeben: `android`, `linux`, `windows`, `raspberry` oder `all`. `all` steht für alle Plattformen."
  placeholder: "[platforms]"
type:
  short:
    en: Required; zip or package
    de: Pflicht; zip oder package
  description:
    en: Required. The plugin distribution type is `zip` or `package`. Debian `package` plugins become [system plugins](https://www.wellenvogel.de/software/avnav/newDoc/latest/en/special/plugins.html#debian-packages); `zip` plugins become [user plugins](https://www.wellenvogel.de/software/avnav/newDoc/latest/en/special/plugins.html#zip-file).
    de: Pflicht. Der Verteilungstyp des Plugins ist `zip` oder `package`. Debian-`package`-Plugins werden zu [System-Plugins](https://www.wellenvogel.de/software/avnav/newDoc/latest/special/plugins.html#debian-pakete); `zip`-Plugins werden zu [Benutzer-Plugins](https://www.wellenvogel.de/software/avnav/newDoc/latest/special/plugins.html#zip-datei).
  placeholder: "[zip/package]"
download_url:
  short:
    en: Required for zip; $version can be used
    de: Pflicht für zip; $version kann verwendet werden
  description:
    en: Required for `zip`. A download URL; `$version` is replaced with the plugin version.
    de: Pflicht für `zip`. Eine Download-URL; `$version` wird durch die Plugin-Version ersetzt.
  placeholder: "[URL]"
documentation:
  short:
    en: Optional; plugin documentation URL
    de: Optional; URL der Plugin-Dokumentation
  description:
    en: Optional URL to the plugin documentation. If it contains `$version`, that placeholder is replaced with the current plugin version when the link is rendered.
    de: Optionale URL zur Plugin-Dokumentation. Wenn sie `$version` enthält, wird dieser Platzhalter beim Erzeugen des Links durch die aktuelle Plugin-Version ersetzt.
  placeholder: "[URL]"
minversion:
  short:
    en: Optional; required AvNav version, optionally a range
    de: Optional; erforderliche AvNav-Version, optional als Bereich
  description:
    en: Optional minimum required AvNav version. You can optionally specify a maximum version as a range, for example `20120101..20260101`.
    de: Optionale minimale erforderliche AvNav-Version. Optional kann eine maximale Version als Bereich angegeben werden, zum Beispiel `20120101..20260101`.
  placeholder: "[version or range]"
src_url:
  short:
    en: Optional; repository URL for github updates
    de: Optional; Repository-URL für github-Updates
  description:
    en: Optional. URL of the source code; for a GitHub-based plugin it must be the GitHub repository URL.
    de: Optional. URL des Quellcodes; bei einem GitHub-basierten Plugin muss es die GitHub-Repository-URL sein.
  placeholder: "[URL]"
author:
  short:
    en: Optional; author name
    de: Optional; Name des Autors
  description:
    en: Optional. Name of the plugin author; for a GitHub `src_url`, this should be the GitHub username.
    de: Optional. Name des Plugin-Autors; bei einer GitHub-`src_url` sollte dies der GitHub-Benutzername sein.
  placeholder: "[author]"
email:
  short:
    en: Required if the author cannot be reached via src_url
    de: Pflicht, wenn der Autor über src_url nicht erreichbar ist
  description:
    en: Required when `src_url` is missing or the author cannot be contacted through it; otherwise optional.
    de: Pflicht, wenn `src_url` fehlt oder der Autor darüber nicht erreichbar ist; ansonsten optional.
  placeholder: "[email]"
license:
  short:
    en: Optional; license abbreviation such as MIT or GPLv2
    de: Optional; Lizenzkürzel wie MIT oder GPLv2
  description:
    en: Optional. An abbreviation identifying the plugin license.
    de: Optional. Eine Abkürzung für die Plugin-Lizenz.
  placeholder: "[license]"
update:
  short:
    en: Optional; github, repository or directory
    de: Optional; github, repository oder directory
  description:
    en: Optional. `github` checks the repository in `src_url` for releases and updates `version` using the release name or `release_pattern`. It is valid for `zip` plugins only. If `filename` is provided, a matching release asset also updates `download_url`. `repository` updates packages from a configured Debian repository. `directory` finds downloads in the configured directory URL using the `filename` pattern.
    de: Optional. `github` prüft das Repository in `src_url` auf Releases und aktualisiert `version` anhand des Release-Namens oder von `release_pattern`. Nur für `zip`-Plugins gültig. Ist `filename` angegeben, aktualisiert ein passendes Release-Asset auch `download_url`. `repository` aktualisiert Pakete aus einem konfigurierten Debian-Repository. `directory` sucht Downloads anhand des `filename`-Musters in der konfigurierten Verzeichnis-URL.
  placeholder: "[github, repository, directory or blank]"
filename:
  short:
    en: Release asset filename for github or filename pattern for directory
    de: Dateiname des Release-Assets für github oder Dateinamenmuster für directory
  description:
    en: For `github`, optionally search release assets for this filename, which may contain `$version`. For `directory`, this is a required JavaScript regular expression matching the end of a filename and extracting its version using the same rules as `release_pattern`.
    de: Für `github` optional der Dateiname des Release-Assets; er kann `$version` enthalten. Für `directory` ist dies ein erforderlicher regulärer JavaScript-Ausdruck, der auf das Ende des Dateinamens passt und die Version nach denselben Regeln wie `release_pattern` ermittelt.
  placeholder: "[filename]"
release_pattern:
  short:
    en: Optional for github; regular expression for the version
    de: Optional für github; regulärer Ausdruck für die Version
  description:
    en: Optional for `github`. A JavaScript regular expression to extract the version from the release name. Use `#semver#` or `#simple#` for predefined patterns, for example `v#semver#`. The first capturing group supplies the version; without a group, the entire match is used.
    de: Optional für `github`. Ein regulärer JavaScript-Ausdruck, um die Version aus dem Release-Namen zu ermitteln. `#semver#` oder `#simple#` können als vordefinierte Muster verwendet werden, zum Beispiel `v#semver#`. Die erste Fanggruppe liefert die Version; ohne Fanggruppe wird der gesamte Treffer verwendet.
  placeholder: "[regular expression]"
